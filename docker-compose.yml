services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testcase-executor-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./testcase_executor.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production-32bytes}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - SCREENSHOTS_DIR=./screenshots
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - FERNET_KEY=${FERNET_KEY:-ZmVybmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seQ==}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-Testcase Executor.AI <onboarding@resend.dev>}
    volumes:
      - ./backend/testcase_executor.db:/app/testcase_executor.db
      - ./backend/screenshots:/app/screenshots
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testcase-executor-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
