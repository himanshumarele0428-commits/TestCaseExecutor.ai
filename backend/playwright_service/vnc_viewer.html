<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Browser</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; }
    #noVNC_screen {
      width: 100%;
      height: 100vh;
      display: flex;
      background: #0f172a;
    }
    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 6px 12px;
      border-radius: 8px;
      background: #1e293b;
      color: #e2e8f0;
      font: 13px system-ui, sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
    }
  </style>
</head>
<body>
  <div id="status">Connecting to live browser…</div>
  <div id="noVNC_screen"></div>

  <script type="module">
    import RFB from '/novnc/core/rfb.js';

    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${protocol}://${window.location.host}/ws/vnc`;

    const status = document.getElementById('status');
    const rfb = new RFB(document.getElementById('noVNC_screen'), url, {
      shared: true,
      credentials: {},
    });

    rfb.scaleViewport = true;
    rfb.resizeSession = false;

    rfb.addEventListener('connect', () => {
      status.textContent = 'Live browser connected';
      setTimeout(() => { status.style.display = 'none'; }, 1500);
    });
    rfb.addEventListener('disconnect', (e) => {
      status.style.display = 'block';
      status.textContent = e.detail.clean ? 'Disconnected' : 'Connection lost';
    });
  </script>
</body>
</html>
